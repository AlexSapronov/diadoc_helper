{% extends 'base.html' %}{% block body %}<div class="page-head"><div><div class="eyebrow">История операций</div><h1>Журнал</h1></div></div><section class="card table-card"><div class="table-wrap"><table><thead><tr><th>Время, UTC</th><th>Действие</th><th>Наш BoxId</th><th>BoxId контрагента</th><th>Подробности</th></tr></thead><tbody>{% for a in logs %}<tr><td>{{ a.created_at }}</td><td>{{ a.action }}</td><td class="mono">{{ a.box_id }}</td><td class="mono">{{ a.cp_box_id }}</td><td>{{ a.detail }}</td></tr>{% else %}<tr><td colspan="5" class="empty">Журнал пуст</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
