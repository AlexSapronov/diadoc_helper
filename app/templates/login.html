{% extends 'base.html' %}{% block title %}Вход · ЭДО Контроль{% endblock %}
{% block body %}<section class="login card"><div class="eyebrow">Система управления ЭДО</div><h1>Вход</h1>
<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf }}">
<label>Логин<input name="username" required autofocus autocomplete="username"></label>
<label>Пароль<input type="password" name="password" required autocomplete="current-password"></label>
<button class="primary full" type="submit">Войти</button></form></section>{% endblock %}
